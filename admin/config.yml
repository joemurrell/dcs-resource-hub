backend: git-gateway


media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "resources"
    label: "DCS Resources"
    files:
      - label: "Master Resource List"
        name: "resources_list"
        file: "_data/resources.yml"
        format: "yaml"
        fields:
          - label: "Resources"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
              - label: "Tags"
                name: "tags"
                widget: "select"
                multiple: true
                options: ["Air-to-Ground", "Air-to-Air", "Tools", "News", "Utilities", "F-16C", "F/A-18C"]
