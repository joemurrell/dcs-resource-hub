backend:
  name: github
  repo: joemurrell/dcs-resource-hub
  branch: main
  # OAuth token exchange is handled by the Cloudflare Worker proxy.
  base_url: https://decap-proxy.dcs-resource-hub.workers.dev
  auth_endpoint: /auth

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "resources"
    label: "DCS Resources"
    files:
      - label: "Master Resource List"
        name: "resources_list"
        file: "_data/resources.yml"
        format: "yaml"
        fields:
          - label: "Resources"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
              - { label: "Date added", name: "date", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: "Author / source", name: "author", widget: "string", required: false }
              - label: "Difficulty"
                name: "difficulty"
                widget: "select"
                required: false
                options: ["Beginner", "Intermediate", "Advanced"]
              - label: "Tags"
                name: "tags"
                widget: "select"
                multiple: true
                options: ["Air-to-Ground", "Air-to-Air", "Tools", "News", "Utilities", "F-16C", "F/A-18C"]
